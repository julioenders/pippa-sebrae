apiVersion: apps/v1
kind: Deployment
metadata:
  name: pippa
  namespace: pippa
  labels:
    app.kubernetes.io/name: pippa
    app.kubernetes.io/component: portal
    app.kubernetes.io/part-of: upp-sebrae
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pippa
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pippa
        app.kubernetes.io/component: portal
    spec:
      containers:
        - name: pippa
          # Substituir pelo Artifact Registry do projeto GCP quando definido:
          # Ex: southamerica-east1-docker.pkg.dev/PROJETO-GCP/pippa/pippa:latest
          image: pippa:latest
          ports:
            - containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            readOnlyRootFilesystem: false
            runAsNonRoot: false
            allowPrivilegeEscalation: false
      restartPolicy: Always
