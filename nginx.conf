server {
    listen 8080;
    server_name pippa.sebrae.com.br;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # --- Raiz redireciona para o portal ---
    location = / {
        return 301 /pippa-portal/;
    }

    # --- Health check para Kubernetes ---
    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # --- Arquivos estáticos (HTML, CSS, JS, imagens) ---
    location / {
        try_files $uri $uri/ $uri/index.html =404;

        # Cache de assets estáticos
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # HTML sem cache forte (permite atualizar sem limpar cache)
        location ~* \.html$ {
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }

    # --- Headers de segurança ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- Compressão gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        text/html
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        text/plain;

    # --- Logs ---
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # --- Páginas de erro ---
    error_page 404 /pippa-portal/index.html;
}
