name: Update Pesquisas Eleitorais

on:
  schedule:
    - cron: '0 10,16,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-polls:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run update script
        working-directory: pippa-pesquisas-eleitorais
        run: python scripts/update_polls.py

      - name: Commit updated dashboard
        run: |
          if git diff --quiet pippa-pesquisas-eleitorais/index.html 2>/dev/null; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pippa-pesquisas-eleitorais/index.html
            git commit -m "dados(pesquisas): atualiza pesquisas eleitorais $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
