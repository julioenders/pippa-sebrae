name: Update Credito e Fomento Data

on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-bcb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch BCB SGS data
        run: python pippa-credito-fomento/scripts/fetch_data.py

      - name: Commit updated data
        run: |
          cd pippa-credito-fomento
          if git diff --quiet data.json 2>/dev/null; then
            echo "No data changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "chore: update credito-fomento data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
